bio: |
  <p>
  I’m a PhD student at
  <a href="https://www.ellisinstitute.fi/" target="_blank" rel="noopener">ELLIS Institute Finland</a> and the
  <a href="https://www.utu.fi/en" target="_blank" rel="noopener">University of Turku</a>,
  supervised by <a href="https://shaoxiongji.github.io/" target="_blank" rel="noopener">Shaoxiong Ji</a>.
  Previously, I worked as a research assistant with
  <a href="https://bjerva.github.io/" target="_blank" rel="noopener">Johannes Bjerva</a> in the
  <a href="https://aaunlp.github.io/" target="_blank" rel="noopener">AAUNLP</a> group at
  <a href="https://www.en.aau.dk/copenhagen" target="_blank" rel="noopener">Aalborg University Copenhagen</a>.
  I earned my master’s degree from the
  <a href="https://www.ku.dk/en" target="_blank" rel="noopener">University of Copenhagen</a>,
  where I worked with <a href="https://apepa.github.io/" target="_blank" rel="noopener">Pepa Atanasova</a>
  and <a href="https://yfyuan01.github.io/" target="_blank" rel="noopener">Yifei Yuan</a>,
  and my bachelor’s degree from the
  <a href="https://english.bit.edu.cn/" target="_blank" rel="noopener">Beijing Institute of Technology</a>,
  both in computer science.
